apply plugin: "com.google.firebase.appdistribution"

android {
  compileSdkVersion 36

  buildToolsVersion "36"

  defaultConfig {
    minSdkVersion 27
    targetSdkVersion 36
    generatedDensities = []
    versionName = System.getenv("APP_SDK_BUILD_VERSION") ?: "1.0.0"
    versionCode = System.getenv("APP_SDK_BUILD_NUMBER") == null 
      ? 1 
      : Integer.parseInt(System.getenv("APP_SDK_BUILD_NUMBER"))
  }

  aaptOptions {
    additionalParameters "--no-version-vectors"
  }

  packaging {
    jniLibs {
      useLegacyPackaging = true
    }
    resources {
      excludes += "META-INF/INDEX.LIST"
      excludes += "META-INF/DEPENDENCIES"
      excludes += "META-INF/io.netty.versions.properties"
    }
  }

  buildTypes {
    getByName("release") {
      signingConfig signingConfigs.debug
      firebaseAppDistribution {
          appId = "1:805028679903:android:a37833dadbcacbdf24d96a"
          artifactType = "APK"
          artifactPath = rootProject.file("./app/build/outputs/apk/release/app-release.apk").path
          serviceCredentialsFile = rootProject.file("../../../../tools/assets/App_Resources/Android/fb-distribution-service-credentials.json").path
          testers = [
              "cvitaman@gmail.com",
              "4ot.testing@gmail.com",
              "julia.schindel@ihreapotheken.de",
              "lorenathiel2@gmail.com",
          ].join(", ")
      }
    }
  }  
}
