name: Package Deploy

on:
  push:
    tags:
      - '*'
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ihreapotheken'
      - name: Publish package
        run: |
          TAG="${{ github.ref_name }}"
          # Parse version components and strip leading zeros for valid semver
          IFS='.-' read -r year month day build <<< "$TAG"
          VERSION="${year}.${month#0}.${day#0}-${build}"
          sed -i "s|\"version\": \".*\"|\"version\": \"${VERSION}\"|" packages/ia-sdk/package.json
          cd packages/ia-sdk
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}