name: Package Deploy

on:
  push:
    tags:
      - '*'
  
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ihreapotheken'
      - name: Update version number
        run: |
          VERSION=${{ github.ref_name }}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" packages/ia-sdk/package.json
      - name: Publish package
        run: |
          cd packages/ia-sdk
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}